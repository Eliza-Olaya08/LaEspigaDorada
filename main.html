<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Espiga Dorada - Inicio</title>
    <link rel="icon" type="image/png" href="img\favicon.png">

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <header>

        <h1>La Espiga Dorada</h1>

        <p>Panes cálidos como el amor de mamá</p>

    </header>

    <main>

        <h2>¡Bienvenido a nuestra panadería!</h2>

        <p>¿Qué deseas administrar hoy?</p>

        
        <div class="opciones">

            <div class="tarjeta">

                <img src="img\producto.jpg" alt="Productos de la panadería">

                <h3>Productos</h3>

                <p>Consulta nuestros panes y productos.</p>

                <button id="btnProductos">Ver productos</button>

            </div>

            <div class="tarjeta">

                <img src="img\inventario.jpg" alt="Inventario de la panadería">

                <h3>Inventario</h3>

                <p>Administra los productos de la panadería.</p>

                <button id="btnInventario">Ver inventario</button>

            </div>

        </div>
        <button id="btnCerrar">Cerrar sesión</button>

    </main>

    <script src="js/main.js"></script>

</body>
</html>
