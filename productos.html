<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Espiga Dorada - Productos</title>
    <link rel="icon" type="image/png" href="img\favicon.png">

    <link rel="stylesheet" href="css/productos.css">
</head>

<body>

    <header>

        <h1>La Espiga Dorada</h1>

        <p>Panes cálidos como el amor de mamá</p>

    </header>

    <main>

        <h2>Nuestros productos</h2>

        <p>Elaborados con cariño para ti.</p>

        <div class="catalogo">

            <div class="producto">
                <h3>Torta de manzana</h3>
                <p>$20000/u</p>
            <div/>

            <div class="producto">
                <img src="img\baguette.jpg" alt="Baguette">
                <h3>Baguette</h3>
                <p>$2.000/u</p>
            </div>

            <div class="producto">
                <img src="img\croissant.jpg" alt="Croissant">
                <h3>Croissant</h3>
                <p>$500/u</p>
            </div>

            <div class="producto">
                <img src="img\integral.jpg" alt="Pan integral">
                <h3>Pan integral</h3>
                <p>$500</p>
            </div>

            <div class="producto">
                <img src="img\pan_dulce.jpg" alt="Pan dulce">
                <h3>Pan dulce</h3>
                <p>$500/u</p>
            </div>

            <div class="producto">
                <img src="img\pan_queso.png" alt="Pan de queso">
                <h3>Pan de queso</h3>
                <p>$300/u</p>
            </div>

            <div class="producto">
                <img src="img\bunuelo.jpg" alt="Buñuelo">
                <h3>Buñuelo Grande</h3>
                <p>$2.000/u</p>
            </div>

            <div class="producto">
                <img src="img\pan_hojaldrado.png" alt="Pan rollo hojaldrado">
                <h3>Pan rollo hojaldrado</h3>
                <p>$200/u</p>
            </div>

        </div>

        <button id="btnVolver">Volver al menú</button>

    </main>

    <script src="js/productos.js"></script>

</body>
</html>
