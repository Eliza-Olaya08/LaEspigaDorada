<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Espiga Dorada - Login</title>
    <link rel="icon" type="image/png" href="img\favicon.png">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="contenedor">

        <div class="imagen">
            <img src="img\panaderia.jpg" alt="Panes artesanales de La Espiga Dorada">
        </div>

        <div class="formulario">

            <h1>La Espiga Dorada</h1>

            <p class="eslogan">Panes cálidos como el amor de mamá</p>

            <h2>Bienvenido</h2>

            <form id="formularioLogin">

                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Ingrese su usuario">

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Ingrese su contraseña">

                <button type="submit">Ingresar</button>

            </form>

            <p id="mensaje"></p>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
